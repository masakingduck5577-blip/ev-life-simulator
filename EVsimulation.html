<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV Life Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F4;--panel:#FFFFFF;--ink:#17232B;--sub:#52606B;--line:#D3DBE1;
  --ev:#1B5E7A;--ev-t:#E3EEF2;--gas:#A8490C;--gas-t:#FAEDE3;--warn:#8A5A00;--warn-t:#FFF4D6;--on-ev:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10181D;--panel:#172229;--ink:#E6ECEF;--sub:#9FB0BB;--line:#2A3842;
    --ev:#6BB8D6;--ev-t:#173541;--gas:#E6955A;--gas-t:#3A2618;--warn:#F2C766;--warn-t:#3A2F12;--on-ev:#0E1A20;
  }
}
:root[data-theme="dark"]{
  --bg:#10181D;--panel:#172229;--ink:#E6ECEF;--sub:#9FB0BB;--line:#2A3842;
  --ev:#6BB8D6;--ev-t:#173541;--gas:#E6955A;--gas-t:#3A2618;--warn:#F2C766;--warn-t:#3A2F12;--on-ev:#0E1A20;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;font-size:15px;line-height:1.65;font-feature-settings:"palt" 1}
h1,h2,h3{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;margin:0;line-height:1.4}
.num{font-variant-numeric:tabular-nums}
a{color:var(--ev)}
button{font:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:560px){.app{border:0}}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);display:flex;align-items:center;gap:6px;height:60px;padding:0 12px;border-bottom:1px solid var(--line)}
.hd .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);border-radius:10px;cursor:pointer}
.hd .ttl{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:17px}
.hd .tag{margin-left:auto;font-size:12px;font-weight:500;color:var(--ev);background:var(--ev-t);padding:4px 10px;border-radius:999px;white-space:nowrap}
.main{flex-grow:1;display:flex;flex-direction:column;gap:22px;padding:20px}
.ft{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.btn{display:flex;min-height:52px;align-items:center;justify-content:center;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;background:var(--ev);color:var(--on-ev);width:100%}
.btn2{display:flex;min-height:48px;align-items:center;justify-content:center;border-radius:12px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;width:100%}
:focus-visible{outline:3px solid var(--ev);outline-offset:2px}

/* home */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hero .area{font-size:12px;font-weight:700;color:var(--ev);letter-spacing:.08em}
.hero h1{font-size:26px}
.hero p{margin:0;color:var(--sub);font-size:14px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;justify-content:space-between;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ev);border-radius:3px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
.hcard{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--panel);width:100%;text-align:left;cursor:pointer}
.hcard:hover{border-color:var(--ev)}
.hcard .lt{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:var(--ev-t);color:var(--ev);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.hcard .tx{flex-grow:1;display:flex;flex-direction:column;gap:3px}
.hcard .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.hcard .d{font-size:13px;color:var(--sub)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--ev);color:var(--on-ev)}
.pill.todo{background:var(--bg);color:var(--sub);font-weight:500}
.pill.soon{background:var(--warn-t);color:var(--warn)}

/* forms */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:16px}
.sec .sd{font-size:13px;color:var(--sub);margin-top:-6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
input[type=number],select{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;height:48px;padding:0 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--ev);height:32px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg label{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--sub);position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--panel);color:var(--ink);font-weight:700}
.seg label:has(input:focus-visible){outline:3px solid var(--ev)}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .val{font-weight:700;font-size:18px;color:var(--ev)}
.slider .rg{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ev);margin:0}
.chk:has(input:checked){border-color:var(--ev);background:var(--ev-t)}
.hint{font-size:12px;color:var(--sub)}
.flag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-t);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* car cards */
.cars{display:flex;flex-direction:column;gap:10px}
.carc{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;position:relative}
.carc input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ev);flex-shrink:0}
.carc:has(input:checked){border:1.5px solid var(--ev);background:var(--ev-t)}
.carc.gas:has(input:checked){border-color:var(--gas);background:var(--gas-t)}
.carc.gas input{accent-color:var(--gas)}
.carc .b{flex-grow:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.carc .nm{font-weight:700;font-size:15px}
.carc .cat{font-size:12px;color:var(--sub)}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin:0}
.spec div{display:flex;flex-direction:column;min-width:0}
.spec dt{font-size:11px;color:var(--sub)}
.spec dd{margin:0;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.custom{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--bg)}
.compare{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--gas-t)}
.compare .k{font-size:12px;color:var(--gas);font-weight:700}
.compare .n{font-weight:700}

/* results */
.verdict{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:14px}
.verdict.good{background:var(--ev-t)} .verdict.bad{background:var(--gas-t)}
.verdict .lead{font-size:13px;color:var(--sub)}
.verdict .big{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:28px;line-height:1.3}
.verdict.good .big{color:var(--ev)} .verdict.bad .big{color:var(--gas)}
.verdict .sub{font-size:14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv .c{padding:12px 14px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.kv .l{font-size:12px;color:var(--sub)}
.kv .v{font-weight:700;font-size:18px}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:12px;color:var(--sub);font-weight:700}
.g{color:var(--gas)} .e{color:var(--ev)}
tr.total td{font-weight:700;border-bottom:0}
.legend{display:flex;gap:16px;font-size:12px;flex-wrap:wrap;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:0;border-top:3px solid}
.sw.g{border-color:var(--gas);border-top-style:dashed} .sw.e{border-color:var(--ev)}
svg text{font-family:'Noto Sans JP',sans-serif}
.warnbox{background:var(--warn-t);border-radius:12px;padding:12px 14px;font-size:13px}
.warnbox strong{color:var(--warn)}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px}
summary{cursor:pointer;font-weight:700;font-size:14px;min-height:48px;display:flex;align-items:center}
details .body{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}

/* total */
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px}
.tile .h{display:flex;align-items:center;gap:8px}
.tile .lt{width:26px;height:26px;border-radius:7px;background:var(--ev-t);color:var(--ev);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tile .ht{font-size:13px;font-weight:700;color:var(--sub)}
.tile .big{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:20px}
.tile .s{font-size:13px;color:var(--sub)}
.tile .links{display:flex;gap:6px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin-left:-10px;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--ev);cursor:pointer;border-radius:8px}

/* stub */
.stub{display:flex;flex-direction:column;gap:12px;padding:20px;border:1.5px dashed var(--line);border-radius:14px}
.stub h2{font-size:18px}
.stub ul{margin:0;padding-left:1.2em;color:var(--sub);font-size:14px}
.stub li{margin:4px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   データ（カタログスペック）
   ok:false の値は仮置き。公式情報・ディーラーヒアリングで更新する
   ========================================================= */
const EVS = {
  "n-one-e":  {name:"N-ONE e:（e:G）", cat:"軽乗用EV", price:2699400, sub:580000, wh:105, kwh:29.6, tax:10800, wt:0, ok:true},
  "super-one":{name:"Super-ONE", cat:"小型EV", price:3390200, sub:1300000, wh:113, kwh:29.6, tax:25000, wt:0, ok:false},
  "insight":  {name:"INSIGHT", cat:"クロスオーバーSUV EV", price:5500000, sub:1300000, wh:134, kwh:68.8, tax:25000, wt:0, ok:true},
  "n-van-e":  {name:"N-VAN e:", cat:"軽商用EV", price:2600000, sub:0, wh:126, kwh:29.6, tax:5000, wt:0, ok:false},
  "custom":   {name:"その他のEV", cat:"スペックを入力", custom:true}
};
const GASES = {
  "n-one": {name:"N-ONE", cat:"軽乗用", price:1800000, fe:23, tax:10800, wt:3300},
  "n-box": {name:"N-BOX", cat:"軽乗用", price:1800000, fe:21, tax:10800, wt:3300},
  "n-van": {name:"N-VAN", cat:"軽商用", price:1500000, fe:18, tax:5000, wt:3300},
  "fit":   {name:"フィット e:HEV", cat:"コンパクト", price:2300000, fe:27, tax:30500, wt:7500},
  "zrv":   {name:"ZR-V e:HEV", cat:"SUV", price:3600000, fe:22, tax:36000, wt:12300},
  "custom":{name:"その他のガソリン車", cat:"スペックを入力", custom:true}
};
const DEP = { gas:{hi:0.12, mid:0.15, lo:0.18}, ev:{hi:0.15, mid:0.19, lo:0.23} }; // 年率の価値減少（仮）
const SCEN_LABEL = {hi:"高め", mid:"中間", lo:"低め"};
const SUBSIDY_HOLD_YEARS = 4;

/* =========================================================
   状態
   ========================================================= */
const S = {
  kmMode:"direct", annualKm:8000, monthlySpend:10000, curFe:15,
  gasKey:"", evKey:"",
  gc_price:2500000, gc_fe:18, gc_tax:30500, gc_wt:7500,
  ec_price:4000000, ec_sub:0, ec_wh:150, ec_kwh:50, ec_tax:25000, ec_wt:0,
  homeCharge:true, homeShare:80, years:7,
  evAdj:0, gasAdj:0, evFees:0, gasFees:0,
  pGas:170, pHome:31, pPub:60, charger:150000, mGas:40000, mEv:25000,
  cSum:0.9, cWin:0.7, rGas:0.85, rEv:0.9, usable:70, scen:"mid",
  seenCost:false
};
const n = k => { const v = parseFloat(S[k]); return isFinite(v) ? v : 0; };
const yen = v => (v<0?"−":"") + "¥" + Math.round(Math.abs(v)).toLocaleString("ja-JP");
const man = v => (v<0?"−":"") + (Math.abs(v)/10000).toFixed(1).replace(/\.0$/,"") + "万円";
const sman = v => (v>0?"+":v<0?"−":"±") + (Math.abs(v)/10000).toFixed(1).replace(/\.0$/,"") + "万円";

function gasCar(){ const d=GASES[S.gasKey]; if(!d) return null;
  return d.custom ? {name:d.name, price:n("gc_price"), fe:n("gc_fe"), tax:n("gc_tax"), wt:n("gc_wt")} : d; }
function evCar(){ const d=EVS[S.evKey]; if(!d) return null;
  return d.custom ? {name:d.name, price:n("ec_price"), sub:n("ec_sub"), wh:n("ec_wh"), kwh:n("ec_kwh"), tax:n("ec_tax"), wt:n("ec_wt")} : d; }
function annualKm(){ return S.kmMode==="spend" ? n("monthlySpend")*12/Math.max(n("pGas"),1)*n("curFe") : n("annualKm"); }
const doneB = () => !!(S.gasKey && S.evKey && S.seenCost);

/* =========================================================
   計算（コスト比較）
   ========================================================= */
function calc(){
  const G = gasCar(), E = evCar(); if(!G||!E) return null;
  const km = annualKm(), N = n("years");
  const share = S.homeCharge ? n("homeShare")/100 : 0;
  const pGas=n("pGas"), pHome=n("pHome"), pPub=n("pPub");
  const cSum=n("cSum")||1, cWin=n("cWin")||1, rGas=n("rGas")||1, rEv=n("rEv")||1;

  const gPrice = G.price + n("gasAdj"), ePrice = E.price + n("evAdj");
  const charger = S.homeCharge ? n("charger") : 0;
  const gInit = gPrice + n("gasFees");
  const eInit = ePrice - E.sub + n("evFees") + charger;

  const feReal = Math.max(G.fe,0.1)*rGas;
  const gasEnergy = km/feReal*pGas;
  const whReal = E.wh/rEv;
  const kWhYear = [1,cSum,1,cWin].reduce((s,c)=> s + (km/4)*whReal/1000/c, 0);
  const avgElec = share*pHome + (1-share)*pPub;
  const evEnergy = kWhYear*avgElec;

  const gAnnual = gasEnergy + G.tax + G.wt + n("mGas");
  const eAnnual = evEnergy + E.tax + E.wt + n("mEv");
  const resid = (p,r) => p*Math.pow(1-r,N);
  const gRes = resid(G.price, DEP.gas[S.scen]), eRes = resid(E.price, DEP.ev[S.scen]);
  const gTotal = gInit + gAnnual*N - gRes, eTotal = eInit + eAnnual*N - eRes;

  const dInit = eInit-gInit, dAnnual = gAnnual-eAnnual;
  let cross, crossT=null;
  if (dInit<=0 && dAnnual>=0) cross = "購入時からEVが安い";
  else if (dAnnual<=0) cross = "この条件では逆転しない";
  else { crossT = dInit/dAnnual; cross = crossT>30 ? "30年超" : `約${crossT.toFixed(1)}年目`; }

  const usable = n("usable")/100, weekKm = km/52;
  const rangeAt = c => E.kwh*usable*1000/(whReal/c);
  const freq = c => { const pw = weekKm/Math.max(rangeAt(c),1); if(pw<=0) return "―"; const d=7/pw; return `週 ${pw.toFixed(1)} 回（約${d>=1?Math.round(d):d.toFixed(1)}日に1回）`; };
  const eKwhKm = kWhYear/Math.max(km,1);

  const scen = ["hi","mid","lo"].map(s => {
    const gr=resid(G.price,DEP.gas[s]), er=resid(E.price,DEP.ev[s]);
    return {s, gr, er, d:(eInit+eAnnual*N-er)-(gInit+gAnnual*N-gr)};
  });
  return {G,E,km,N,gPrice,ePrice,charger,gInit,eInit,gasEnergy,evEnergy,gAnnual,eAnnual,gRes,eRes,gTotal,eTotal,
    diff:eTotal-gTotal, dInit, dAnnual, cross, crossT,
    k100g:100/(pGas/feReal), k100h:S.homeCharge?100/(eKwhKm*pHome):null, k100a:100/(eKwhKm*avgElec),
    fq:{mid:freq(1), sum:freq(cSum), win:freq(cWin)}, rangeMid:rangeAt(1), rangeWin:rangeAt(cWin), usable, scen};
}

/* =========================================================
   UI部品
   ========================================================= */
const CHEV_L='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const CHEV_R='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
const header = (title, back, tag) => `<header class="hd">${back?`<button class="back" data-go="${back}" aria-label="戻る">${CHEV_L}</button>`:'<div style="width:8px"></div>'}<h1 class="ttl">${title}</h1><span class="tag">${tag}</span></header>`;
const footer = (...b) => `<footer class="ft">${b.join("")}</footer>`;
const btn = (to,t,dis) => `<button class="btn" data-go="${to}"${dis?' disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed"':""}>${t}</button>`;
const btn2 = (to,t) => `<button class="btn2" data-go="${to}">${t}</button>`;
const numIn = (k,label,step=1,flag=false) => `<label class="f">${label}${flag?' <span class="flag">要確認</span>':""}<input type="number" inputmode="decimal" data-k="${k}" value="${S[k]}" step="${step}"></label>`;
const slider = (k,label,min,max,step,fmt,lo,hi,id) => `<div class="slider"><div class="top"><label for="${k}" style="font-size:14px">${label}</label><span class="val num" id="${id}">${fmt(S[k])}</span></div><input type="range" id="${k}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}"><div class="rg"><span>${lo}</span><span>${hi}</span></div></div>`;
const spec = items => `<dl class="spec">${items.map(([t,v])=>`<div><dt>${t}</dt><dd>${v}</dd></div>`).join("")}</dl>`;

/* =========================================================
   画面
   ========================================================= */
const screens = {};

screens.home = () => {
  const done = doneB() ? 1 : 0;
  const card = (l,t,d,to,st) => `<button class="hcard" data-go="${to}"><span class="lt">${l}</span><span class="tx"><span class="t">${t}${st}</span><span class="d">${d}</span></span><span style="color:var(--sub)">${CHEV_R}</span></button>`;
  return header("EV Life Simulator",null,"ホーム") + `<main class="main">
    <div class="hero"><span class="area">UTSUNOMIYA × HAGA</span><h1>EVのある暮らしを、<br>自分の生活で試算する</h1><p>3つの項目から、コスト・行ける範囲・暮らしの変化がわかります。どこから始めても大丈夫です。</p></div>
    <div class="prog"><div class="row"><strong>入力状況</strong><span class="num" style="color:var(--sub)">${done} / 3 完了</span></div><div class="bar"><i style="width:${done/3*100}%"></i></div></div>
    ${card("A","ライフスタイル","充電環境・通勤・休日の使い方","lifestyle",'<span class="pill soon">準備中</span>')}
    ${card("B","車両とコスト","ガソリン新車とEV新車の総額を比較","gas", doneB()?'<span class="pill done">入力済み</span>':'<span class="pill todo">未入力</span>')}

/* =========================================================
   グラフ
   ========================================================= */
function drawChart(r){
  const svg = document.getElementById("chart"); if(!svg) return;
  const W=520,H=260,L=56,R=86,T=16,B=34, N=r.N;
  const cs = getComputedStyle(document.documentElement), c = k => cs.getPropertyValue(k).trim();
  const g=[],e=[]; for(let i=0;i<=N;i++){ g.push(r.gInit+r.gAnnual*i); e.push(r.eInit+r.eAnnual*i); }
  const fg=g[N]-r.gRes, fe=e[N]-r.eRes;
  const top=Math.ceil(Math.max(...g,...e)/1e6)*1e6||1e6, bot=Math.floor(Math.min(0,fg,fe)/1e6)*1e6;
  const x=i=>L+(W-L-R)*i/Math.max(N,1), y=v=>T+(H-T-B)*(1-(v-bot)/(top-bot));
  const step=(top-bot)>6e6?2e6:1e6; let s="";
  for(let v=bot;v<=top+1;v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${c("--line")}"/><text x="${L-6}" y="${y(v)+4}" font-size="11" fill="${c("--sub")}" text-anchor="end">${v/10000}万</text>`; }
  const ls=N>8?2:1; for(let i=0;i<=N;i+=ls) s+=`<text x="${x(i)}" y="${H-B+18}" font-size="11" fill="${c("--sub")}" text-anchor="middle">${i?i+"年":"購入時"}</text>`;
  const p=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  s+=`<path d="${p(g)}" fill="none" stroke="${c("--gas")}" stroke-width="2.5" stroke-dasharray="7 5"/><path d="${p(e)}" fill="none" stroke="${c("--ev")}" stroke-width="3.5"/>`;
  [[g[N],fg,"--gas"],[e[N],fe,"--ev"]].forEach(([a,b,k])=>{ s+=`<line x1="${x(N)}" y1="${y(a)}" x2="${x(N)+24}" y2="${y(b)}" stroke="${c(k)}" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="${x(N)+24}" cy="${y(b)}" r="4" fill="${c(k)}"/><text x="${x(N)+31}" y="${y(b)+4}" font-size="11" fill="${c(k)}">${man(b)}</text>`; });
  if(r.crossT!==null && r.crossT<=N){ const v=r.gInit+r.gAnnual*r.crossT, cx=L+(W-L-R)*r.crossT/Math.max(N,1);
    s+=`<circle cx="${cx}" cy="${y(v)}" r="6" fill="${c("--panel")}" stroke="${c("--ink")}" stroke-width="2"/><text x="${cx}" y="${y(v)-12}" font-size="12" font-weight="700" fill="${c("--ink")}" text-anchor="middle">約${r.crossT.toFixed(1)}年で逆転</text>`; }
  svg.innerHTML=s;
}

/* =========================================================
   ルーティングとイベント
   ========================================================= */
const app = document.getElementById("app");
let current = "home";
function render(keepScroll){
  const y = window.scrollY;
  const route = (location.hash.replace(/^#\/?/,"") || "home");
  current = screens[route] ? route : "home";
  app.innerHTML = screens[current]();
  screens[current].update?.();
  window.scrollTo(0, keepScroll ? y : 0);
  if(!keepScroll){ const h = app.querySelector(".ttl"); document.title = (h?h.textContent+"｜":"") + "EV Life Simulator"; }
}
function go(to){
  if(to==="rental-go"){ return; }
  if(("#/"+to)===location.hash) render(false); else location.hash = "/"+to;
}
window.addEventListener("hashchange", () => render(false));
app.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if(!b || b.disabled) return; go(b.dataset.go); });
app.addEventListener("input", e => {
  const k = e.target.dataset.k; if(!k) return;
  S[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
  // 表示構造が変わる入力は再描画、それ以外は結果だけ更新
  if (["gasKey","evKey","kmMode"].includes(k)) { render(true); return; }
  if (k==="homeCharge"){ const w=document.getElementById("shareWrap"); if(w) w.hidden=!S.homeCharge; }
  if (k==="homeShare"){ const o=document.getElementById("shareOut"); if(o) o.textContent=S.homeShare+"%"; }
  const ko = document.getElementById("kmOut"); if(ko) ko.textContent = `年間 約${Math.round(annualKm()).toLocaleString("ja-JP")}km として計算します`;
  screens[current].update?.();
});
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => screens[current].update?.());
render(false);
</script>
